<!DOCTYPE html>
<html>
<head>
    <title>Thank You</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
        }
        h1 {
            color: #2ecc71;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
        }
        .btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>ကျေးဇူးတင်ပါတယ်။</h1>
        <p>သင့်ရဲ့အချက်အလက်တွေကို လက်ခံရရှိပါပြီ။ <br>မကြာခင်မှာ ပြန်လည်ဆက်သွယ်ပါမယ်။</p>
        <a href="/" class="btn">ပင်မစာမျက်နှာသို့ပြန်မယ်</a>
    </div>
</body>
</html>
